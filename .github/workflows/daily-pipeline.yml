name: Daily BIST Sentiment Pipeline

on:
  workflow_dispatch:
    inputs:
      kap_days:
        description: "KAP icin geriye donuk gun sayisi"
        required: false
        default: "7"
      baseline_lookback_days:
        description: "Gecmis karsilastirma gun sayisi"
        required: false
        default: "365"
      baseline_min_history:
        description: "Anomali icin minimum gecmis gun sayisi"
        required: false
        default: "5"
      report_date:
        description: "Istege bagli rapor tarihi. Ornek: 2026-06-07"
        required: false
        default: ""
      telegram_chat_id:
        description: "Istege bagli hedef Telegram chat id. Bos ise TELEGRAM_CHAT_ID secret kullanilir."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-bist-sentiment
  cancel-in-progress: false

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Train deploy model
        run: |
          uv run train_model \
            --input data/labels/labeled_news_master.csv \
            --model-out models/master_baseline_sentiment.joblib \
            --report-dir reports/master_baseline \
            --split-strategy stratified

      - name: Run daily pipeline
        env:
          KAP_DAYS: ${{ github.event.inputs.kap_days }}
          BASELINE_LOOKBACK_DAYS: ${{ github.event.inputs.baseline_lookback_days }}
          BASELINE_MIN_HISTORY: ${{ github.event.inputs.baseline_min_history }}
          REPORT_DATE: ${{ github.event.inputs.report_date }}
        run: |
          KAP_DAYS="${KAP_DAYS:-7}"
          BASELINE_LOOKBACK_DAYS="${BASELINE_LOOKBACK_DAYS:-365}"
          BASELINE_MIN_HISTORY="${BASELINE_MIN_HISTORY:-5}"
          REPORT_DATE="${REPORT_DATE:-}"

          COMMAND=(
            uv run daily_pipeline
            --kap-days "$KAP_DAYS"
            --update-history
            --baseline-lookback-days "$BASELINE_LOOKBACK_DAYS"
            --baseline-min-history "$BASELINE_MIN_HISTORY"
          )

          if [ -n "$REPORT_DATE" ]; then
            COMMAND+=(
              --kap-from-date "$REPORT_DATE"
              --kap-to-date "$REPORT_DATE"
              --date "$REPORT_DATE"
            )
          fi

          "${COMMAND[@]}"

      - name: Send Telegram brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.telegram_chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set. Skipping Telegram send."
            exit 0
          fi

          python - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          telegram_files = sorted(
              Path("reports/daily_alerts").glob("*_telegram.html"),
              key=lambda path: path.stat().st_mtime,
          )
          if not telegram_files:
              raise SystemExit("No Telegram report found under reports/daily_alerts.")

          telegram_path = telegram_files[-1]
          text = telegram_path.read_text(encoding="utf-8")[:3900]
          payload = urllib.parse.urlencode(
              {
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": text,
                  "parse_mode": "HTML",
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              data=payload,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status >= 400:
                  raise RuntimeError(f"Telegram send failed with HTTP {response.status}")
          print(f"Telegram brief sent: {telegram_path}")
          PY

      - name: Upload daily outputs
        uses: actions/upload-artifact@v4
        with:
          name: daily-bist-sentiment-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            reports/daily_alerts/
            data/raw/kap_daily.csv
            data/processed/kap_daily_prepared.csv
            data/processed/kap_daily_scored_news.csv
            data/processed/kap_daily_sentiment.csv

      - name: Commit updated historical outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f \
            data/raw/kap_api_historical_news.csv \
            data/processed/kap_api_historical_prepared.csv \
            data/processed/kap_api_historical_scored_news.csv \
            data/processed/kap_api_historical_daily_sentiment.csv \
            reports/daily_alerts

          if git diff --cached --quiet; then
            echo "No report or historical data changes to commit."
          else
            git commit -m "Update daily BIST sentiment outputs [skip ci]"
            git push
          fi
